# Refuse any package published less than 24 hours ago, whatever pulls it in.
minimumReleaseAge: 1440

# No dependency or project lifecycle script runs on install.
ignoreScripts: true

engineStrict: true

savePrefix: ""

# miniflare pins undici 7.29.1 exactly (still so in wrangler 4.152.0), below the 7.30.1 fix
# for GHSA-xjj6-f33q-929c and two moderates. Drop it once miniflare pins 7.30.1 or later.
overrides:
  miniflare>undici: 7.30.1
  # Rolldown's wasm binding drags in emnapi 2.0.0-beta.2; astro2tsx crashes on that runtime.
  "@napi-rs/wasm-runtime@1.2.4>@emnapi/runtime": 1.11.3
