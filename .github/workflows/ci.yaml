name: CI

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Site
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
      # Fails on a known vulnerability, moderate or worse, in any installed package.
      - run: pnpm audit --audit-level=moderate
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm types:check
      - run: pnpm test
      # Builds to dist/, then runs scripts/check-build.ts over it.
      - run: pnpm build
      # preview.yaml deploys it once CI passes. This job holds no secrets, so a pull request's
      # code builds the site but never runs beside the deploy token.
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # The hooks contributors run locally, less the three the site job already runs. They need
  # no Node, so this job installs only prek.
  hooks:
    name: Hooks
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: prek
      - run: prek run --all-files --show-diff-on-failure --color=always
        env:
          SKIP: oxlint,oxfmt,prettier
